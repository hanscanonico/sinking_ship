# The merge gate, run for us instead of remembered: the same targets
# `make verify` chains. The static gates run in one job; the suite is dealt
# across parallel shards by tools/test_shards.py, balanced on
# tests/durations.tsv — run in one engine it took over 70 minutes (SH34).
# The `verify` job at the end is the one verdict: green only when every
# other job is.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to a branch supersedes the first: the gate only ever answers for
# the tip. Main keeps every run, so each commit there has its own verdict.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The engine version the repo pins.
  GODOT_VERSION: 4.7.1-stable
  # Every Makefile target and gate script reads this.
  GODOT: bin/godot

jobs:
  static:
    name: check, lint, format-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gdlint and gdformat, the `lint` and `format-check` steps.
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - uses: ./.github/actions/setup-godot

      - name: check
        run: make check

      - name: lint
        run: make lint

      - name: format-check
        run: make format-check

  test:
    name: test ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    # A guard against a hung engine, not a budget: the longest shard is
    # test_must_sink.gd alone, about 13 minutes, most of it working out the
    # steamer's 40 match hits (SimFixtures.match_hits) in its own engine.
    timeout-minutes: 40
    strategy:
      # Every shard reports, so one red run names every failing script.
      fail-fast: false
      matrix:
        # Change the 8 in SHARD and the job name with this list.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot

      - name: test
        run: make test SHARD=${{ matrix.shard }}/8

  verify:
    needs: [static, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every gate passed
        run: |
          echo "static: ${{ needs.static.result }}, test: ${{ needs.test.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success
