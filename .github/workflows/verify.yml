# The merge gate, run for us instead of remembered: the targets `make verify`
# chains but bake-check. The static gates — check, guard-check, ship-gen-check,
# lint and format-check — run in one job; the suite is dealt
# across parallel shards by tools/test_shards.py, balanced on
# tests/durations.tsv — run in one engine it took over 70 minutes (SH34) — and
# art-lint runs in a job of its own beside them.
# The `verify` job at the end is the one verdict: green only when every
# other job is.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to a branch supersedes the first: the gate only ever answers for
# the tip. Main keeps every run, so each commit there has its own verdict: each of
# its commits is a group of its own, as a group holds one pending run and cancels an
# older one waiting behind a running one — on 2026-10-23 that cancelled main's run
# for #264, the very merge that took ship_art.gd past the line cap.
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Untrusted PR code runs here: the token reads the repository and nothing more.
permissions:
  contents: read

env:
  # The engine version the repo pins.
  GODOT_VERSION: 4.7.1-stable
  # Every Makefile target and gate script reads this.
  GODOT: bin/godot

jobs:
  static:
    name: check, lint, format-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gdlint and gdformat, the `lint` and `format-check` steps.
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - uses: ./.github/actions/setup-godot

      - name: check
        run: make check

      - name: guard-check
        run: make guard-check

      # Every data/ships/NAME.tres and test hull held to its tools/gen_NAME.py;
      # python3 is setup-python's.
      - name: ship-gen-check
        run: make ship-gen-check

      - name: lint
        run: make lint

      - name: format-check
        run: make format-check

  test:
    name: test ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    # A guard against a hung engine, not a budget: the shards are dealt about
    # 7 minutes apiece (tests/durations.tsv), the longest single script
    # test_must_sink.gd, most of it working out the steamer's 40 match hits
    # (SimFixtures.match_hits) in its own engine.
    timeout-minutes: 40
    strategy:
      # Every shard reports, so one red run names every failing script.
      fail-fast: false
      matrix:
        # Change the 8 in SHARD and the job name with this list.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot

      - name: test
        run: make test SHARD=${{ matrix.shard }}/8

  # The art against the data and the snapshots (tools/art_lint.gd), every ship and a
  # match, beside the shards rather than after them. Run only by hand before, it had
  # gathered 25 problems on main by the time someone did (#270).
  art-lint:
    name: art-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot

      - name: art-lint
        run: make art-lint

  verify:
    needs: [static, test, art-lint]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every gate passed
        run: |
          echo "static: ${{ needs.static.result }}, test: ${{ needs.test.result }}, art-lint: ${{ needs.art-lint.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.art-lint.result }}" = success
