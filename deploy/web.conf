# The browser build as static files (SH12), behind deploy/proxy.conf. The build is
# single-threaded, so it needs no cross-origin isolation headers.
server {
	listen 8080;
	server_tokens off;
	root /usr/share/nginx/html;
	# Every request here carries the page's query (?room=…&name=…) and comes from the
	# proxy, which logs what is safe to: nothing of it is logged here but the critical.
	access_log off;
	error_log /var/log/nginx/error.log crit;

	# The exported files keep their names from one deploy to the next: a browser asks
	# again every time, and is told 304 when nothing changed.
	add_header Cache-Control "no-cache" always;

	# The engine's .wasm is about 40 MB, and compresses to about a quarter.
	gzip on;
	gzip_types application/wasm application/javascript application/octet-stream;
	gzip_min_length 1024;

	location / {
		limit_except GET HEAD {
			deny all;
		}
		try_files $uri =404;
	}

	location = / {
		try_files /index.html =404;
	}
}
