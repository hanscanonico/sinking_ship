# The front of the stack (SH12, R9): cloudflared hands it every request from the
# tunnel; it serves the browser build from `web`, upgrades /ws to the game server,
# and holds each client address to a few game connections and a slow rate of new
# ones. The game server only ever sees this proxy's address, so this is the only
# place a per-address limit can live.
#
# Nothing here logs a player: no client address, page query (?room=…&name=…), user
# agent or referer. The access log records the method, path and status alone, and the
# error log — whose every line about a request names its client and its request line
# — only what is critical. deploy/README.md says what is logged where.

# Who the client is. Cloudflare's edge sets CF-Connecting-IP to the address it was
# reached from, replacing anything a client sent. Only cloudflared — at the address
# compose.yml fixes for it — may say so; any other request, the host's own through
# the edge network's gateway too, is keyed on its own address.
set_real_ip_from 10.247.47.6;
real_ip_header CF-Connecting-IP;

# What the per-address limits count by: an IPv4 client's address, and an IPv6
# client's /64 — the first 8 of its 16 bytes — as one subscriber is handed a whole /64.
map $binary_remote_addr $limit_key {
	"~(?s)^(?<net64>.{8}).{8}$" $net64;
	default $binary_remote_addr;
}

# Per client: game connections open at once, game connections opened (one every ten
# seconds, six at a go), and page requests.
limit_conn_zone $limit_key zone=games:10m;
limit_req_zone $limit_key zone=game_opens:10m rate=6r/m;
limit_req_zone $limit_key zone=pages:10m rate=20r/s;
limit_conn_status 429;
limit_req_status 429;

log_format anonymous '$time_iso8601 $request_method $uri $status $body_bytes_sent '
	'$request_time';

map $http_upgrade $connection_upgrade {
	default upgrade;
	"" close;
}

# Docker's DNS, asked again as containers restart: a name resolved once at start
# would go stale with a recreated container's address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
	listen 8080;
	server_tokens off;
	client_max_body_size 1k;
	access_log /var/log/nginx/access.log anonymous;
	error_log /var/log/nginx/error.log crit;

	location = /ws {
		limit_conn games 4;
		limit_req zone=game_opens burst=6 nodelay;
		set $game http://server:47923;
		proxy_pass $game;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering off;
		# The server pings every second: a minute without a byte is a dead peer.
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	location = /healthz {
		access_log off;
		return 200 "ok\n";
	}

	location / {
		limit_req zone=pages burst=60 nodelay;
		set $site http://web:8080;
		proxy_pass $site;
		proxy_http_version 1.1;
	}
}
